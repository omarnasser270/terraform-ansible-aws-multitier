---
- name: Install MariaDB server and Python MySQL driver
  ansible.builtin.apt:
    name:
      - mariadb-server
      - python3-pymysql
    state: present

- name: Configure MariaDB to listen on the private IP
  ansible.builtin.template:
    src: custom.cnf.j2
    dest: /etc/mysql/mariadb.conf.d/99-custom.cnf
    owner: root
    group: root
    mode: '0644'
  notify: Restart mariadb

- name: Apply configuration changes now
  ansible.builtin.meta: flush_handlers

- name: Enable and start MariaDB
  ansible.builtin.service:
    name: mariadb
    state: started
    enabled: true

- name: Create the application database
  community.mysql.mysql_db:
    name: "{{ db_name }}"
    state: present
    login_unix_socket: /run/mysqld/mysqld.sock

- name: Create the application user
  community.mysql.mysql_user:
    name: "{{ db_user }}"
    password: "{{ vault_db_password }}"
    host: "{{ db_allowed_hosts }}"
    priv: "{{ db_name }}.*:ALL"
    state: present
    login_unix_socket: /run/mysqld/mysqld.sock
  no_log: true

- name: Wait for MariaDB to listen on the private IP
  ansible.builtin.wait_for:
    host: "{{ ansible_default_ipv4.address }}"
    port: 3306
    timeout: 30

- name: Copy the application SQL dump
  ansible.builtin.copy:
    src: "{{ lookup('env', 'HOME') }}/vprofile-project/src/main/resources/db_backup.sql"
    dest: /tmp/db_backup.sql
    mode: '0644'

- name: Count tables already in the application database
  ansible.builtin.command: >
    mysql -N -B -e
    "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='{{ db_name }}'"
  register: db_tables
  changed_when: false

- name: Import the SQL dump only when the database is empty
  community.mysql.mysql_db:
    name: "{{ db_name }}"
    state: import
    target: /tmp/db_backup.sql
    login_unix_socket: /run/mysqld/mysqld.sock
  when: db_tables.stdout | int == 0
