---
- name: Install Java and Nginx
  ansible.builtin.apt:
    name:
      - openjdk-17-jre-headless
      - nginx
    state: present
    
- name: Map backend hostnames to private IPs
  ansible.builtin.blockinfile:
    path: /etc/hosts
    marker: "# {mark} ANSIBLE MANAGED BACKEND HOSTS"
    block: |
      {{ hostvars[groups['mariadb'][0]].ansible_host }} db01
      {{ hostvars[groups['memcached'][0]].ansible_host }} mc01
      {{ hostvars[groups['rabbitmq'][0]].ansible_host }} rmq01

- name: Create the tomcat group
  ansible.builtin.group:
    name: tomcat
    state: present

- name: Create the tomcat user
  ansible.builtin.user:
    name: tomcat
    group: tomcat
    system: true
    shell: /usr/sbin/nologin
    home: "{{ tomcat_home }}"
    create_home: false

- name: Create the tomcat directory
  ansible.builtin.file:
    path: "{{ tomcat_home }}"
    state: directory
    owner: tomcat
    group: tomcat
    mode: '0755'

- name: Download and unpack Tomcat
  ansible.builtin.unarchive:
    src: "{{ tomcat_url }}"
    dest: "{{ tomcat_home }}"
    remote_src: true
    extra_opts: ['--strip-components=1']
    owner: tomcat
    group: tomcat
    creates: "{{ tomcat_home }}/bin/catalina.sh"

- name: Install the Tomcat systemd unit
  ansible.builtin.template:
    src: tomcat.service.j2
    dest: /etc/systemd/system/tomcat.service
    mode: '0644'
  notify: Reload systemd

- name: Deploy the application WAR as ROOT
  ansible.builtin.copy:
    src: "{{ vprofile_war_src }}"
    dest: "{{ tomcat_home }}/webapps/ROOT.war"
    owner: tomcat
    group: tomcat
    mode: '0644'
  notify: Redeploy application

- name: Apply pending handlers before starting services
  ansible.builtin.meta: flush_handlers

- name: Set RabbitMQ password from Ansible Vault
  ansible.builtin.lineinfile:
    path: "{{ tomcat_home }}/webapps/ROOT/WEB-INF/classes/application.properties"
    regexp: '^rabbitmq.password='
    line: "rabbitmq.password={{ vault_rabbitmq_password }}"
    owner: tomcat
    group: tomcat
    mode: '0640'
  no_log: true

- name: Set MariaDB password from Ansible Vault
  ansible.builtin.lineinfile:
    path: "{{ tomcat_home }}/webapps/ROOT/WEB-INF/classes/application.properties"
    regexp: '^jdbc.password='
    line: "jdbc.password={{ vault_db_password }}"
    owner: tomcat
    group: tomcat
    mode: '0640'
  no_log: true

- name: Restart Tomcat after updating RabbitMQ credentials
  ansible.builtin.systemd:
    name: tomcat
    state: restarted


- name: Enable and start Tomcat
  ansible.builtin.systemd:
    name: tomcat
    state: started
    enabled: true

- name: Remove the default Nginx site
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: Reload nginx

- name: Configure Nginx as a reverse proxy
  ansible.builtin.template:
    src: vprofile.conf.j2
    dest: /etc/nginx/conf.d/vprofile.conf
    mode: '0644'
  notify: Reload nginx

- name: Enable and start Nginx
  ansible.builtin.service:
    name: nginx
    state: started
    enabled: true

- name: Apply Nginx changes now
  ansible.builtin.meta: flush_handlers

- name: Wait until the application answers through Nginx
  ansible.builtin.uri:
    url: http://localhost/
    status_code: [200, 302]
    follow_redirects: none
  register: app_check
  retries: 30
  delay: 10
  until: app_check.status in [200, 302]
